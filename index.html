<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Cardápio Digital</title>
    <style>
        :root {
            --primary: #ff4757;
            --dark: #2f3542;
            --light: #f1f2f6;
            --success: #2ed573;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f8f9fa; color: var(--dark); padding-bottom: 90px; }
        
        header { background: var(--dark); color: white; padding: 20px; text-align: center; }
        header h1 { color: var(--primary); margin-bottom: 5px; }

        .container { max-width: 1200px; margin: 20px auto; padding: 0 15px; }

        /* Banners / Promoções */
        .promo-banner {
            background: linear-gradient(135deg, #ff6b6b, #ee5253);
            color: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(238, 82, 83, 0.3);
            display: none;
        }
        .promo-images { display: flex; gap: 10px; justify-content: center; margin-top: 15px; flex-wrap: wrap; }
        .promo-images img { width: 140px; height: 90px; object-fit: cover; border-radius: 8px; cursor: pointer; }

        /* Categorias e Produtos */
        .category-section { margin-bottom: 40px; }
        .section-title { font-size: 1.5rem; margin-bottom: 20px; border-bottom: 2px solid #ddd; padding-bottom: 5px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        
        .card { background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08); display: flex; flex-direction: column; justify-content: space-between; }
        .card img { width: 100%; height: 180px; object-fit: cover; cursor: pointer; }
        .card-content { padding: 15px; }
        .card-title { font-size: 1.2rem; font-weight: bold; margin-bottom: 8px; }
        .card-desc { font-size: 0.9rem; color: #666; margin-bottom: 12px; }
        .card-footer { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: #fafafa; border-top: 1px solid #eee; }
        .price { font-size: 1.2rem; font-weight: bold; color: var(--primary); }

        .btn { background: var(--primary); color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn:hover { background: #e84118; }
        .btn-success { background: var(--success); }
        .btn-success:hover { background: #26af5f; }

        /* Barra do Carrinho */
        .cart-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--dark); color: white; padding: 15px 20px; display: none; justify-content: space-between; align-items: center; z-index: 900; box-shadow: 0 -4px 10px rgba(0,0,0,0.2); }
        .cart-info { font-size: 1.1rem; font-weight: bold; }

        /* Modais */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 15px; }
        .modal { background: white; width: 100%; max-width: 500px; border-radius: 10px; overflow: hidden; max-height: 90vh; display: flex; flex-direction: column; }
        .modal-header { background: var(--dark); color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .modal-body { padding: 20px; overflow-y: auto; }
        .modal-body img { width: 100%; height: 200px; object-fit: cover; border-radius: 8px; margin-bottom: 15px; }
        .close-btn { background: none; border: none; color: white; font-size: 1.5rem; cursor: pointer; }
        
        .addon-group { margin-top: 15px; }
        .addon-item { display: flex; justify-content: space-between; margin-bottom: 8px; align-items: center; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
        .modal-footer { padding: 15px; background: #f1f2f6; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #ddd; }

        .zoom-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; justify-content: center; align-items: center; z-index: 2000; cursor: pointer; }
        .zoom-modal img { max-width: 90%; max-height: 90%; border-radius: 5px; }
    </style>
</head>
<body>

    <header>
        <h1 id="shopTitle">Carregando...</h1>
        <p>Cardápio Digital</p>
    </header>

    <div class="container">
        <div class="promo-banner" id="promoBannerSection">
            <h2>🔥 Destaques e Promoções 🔥</h2>
            <div class="promo-images" id="promoContainer"></div>
        </div>

        <div id="menuContainer"></div>
    </div>

    <div class="cart-bar" id="cartBar">
        <div class="cart-info" id="cartSummary">0 itens | Total: R$ 0,00</div>
        <button class="btn btn-success" onclick="openCheckoutModal()">Finalizar Pedido (WhatsApp)</button>
    </div>

    <!-- Modal Adicionais -->
    <div class="modal-overlay" id="productModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalProductName">Produto</h3>
                <button class="close-btn" onclick="closeModal('productModal')">×</button>
            </div>
            <div class="modal-body">
                <img id="modalProductImg" src="">
                <p id="modalProductDesc"></p>
                <div class="addon-group">
                    <h4>Adicionais:</h4>
                    <div id="addonsList"></div>
                </div>
            </div>
            <div class="modal-footer">
                <div>Subtotal: <span class="price" id="modalTotalPrice">R$ 0,00</span></div>
                <button class="btn" onclick="confirmAddToCart()">Adicionar ao Carrinho</button>
            </div>
        </div>
    </div>

    <!-- Modal Checkout -->
    <div class="modal-overlay" id="checkoutModal">
        <div class="modal">
            <div class="modal-header">
                <h3>Finalizar Pedido</h3>
                <button class="close-btn" onclick="closeModal('checkoutModal')">×</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Seu Nome Completo:</label>
                    <input type="text" id="clientName" placeholder="Ex: Carlos Silva">
                </div>
                <div class="form-group">
                    <label>Seu WhatsApp:</label>
                    <input type="text" id="clientPhone" placeholder="Ex: (11) 98888-7777">
                </div>
                <div class="form-group">
                    <label>Endereço de Entrega:</label>
                    <input type="text" id="clientAddress" placeholder="Rua, Número, Bairro">
                </div>
            </div>
            <div class="modal-footer">
                <div>Total Geral: <span class="price" id="checkoutTotal">R$ 0,00</span></div>
                <button class="btn btn-success" onclick="enviarPedidoWhatsApp()">Enviar Nota Fiscal 📲</button>
            </div>
        </div>
    </div>

    <div class="zoom-modal" id="zoomModal" onclick="this.style.display='none'">
        <img id="zoomImg" src="">
    </div>

    <script>
        // ENDEREÇO BASE DO SEU NOCODB
        const NOCODB_BASE_URL = "https://app.nocodb.com/api/v1/db/data/v1/p_SEU_PROJETO_ID";
        const NOCODB_TOKEN = "SEU_TOKEN_DE_API_DO_NOCODB";

        // Captura o slug da loja direto da URL (Ex: meucardapio.vercel.app/?loja=joao)
        const urlParams = new URLSearchParams(window.location.search);
        const lojaSlug = urlParams.get('loja');

        let dadosLicencaLojista = null;
        let listaItensCliente = [];
        let carrinho = [];
        let produtoSelecionado = null;

        async function inicializarSistema() {
            if (!lojaSlug) {
                document.body.innerHTML = "<h2 style='text-align:center; margin-top:50px;'>Por favor, acesse utilizando o link fornecido pela loja.</h2>";
                return;
            }

            try {
                // 1. O código consulta a Tabela Mestre 'clientes_licencas'
                const resMestre = await fetch(`${NOCODB_BASE_URL}/clientes_licencas?where=(slug,eq,${lojaSlug})`, {
                    headers: { 'xc-token': NOCODB_TOKEN }
                });
                const jsonMestre = await resMestre.json();

                if (!jsonMestre.list || jsonMestre.list.length === 0) {
                    document.body.innerHTML = "<h2 style='text-align:center; margin-top:50px;'>Estabelecimento não encontrado.</h2>";
                    return;
                }

                dadosLicencaLojista = jsonMestre.list[0];

                // 2. Valida se a licença está ATIVA (Controle de Mensalidade)
                if (dadosLicencaLojista.status_liberacao !== 'Ativo') {
                    document.body.innerHTML = "<h2 style='text-align:center; margin-top:50px; color: red;'>Este cardápio está temporariamente indisponível. Entre em contato com a loja.</h2>";
                    return;
                }

                document.getElementById('shopTitle').innerText = dadosLicencaLojista.nome_loja;
                document.getElementById('pageTitle').innerText = dadosLicencaLojista.nome_loja + " - Cardápio Digital";

                // 3. A MÁGICA ACONTECE AQUI: O código busca DINAMICAMENTE na tabela exclusiva do cliente
                const nomeTabelaExclusiva = dadosLicencaLojista.nome_da_tabela; // Ex: "cardapio_joao"

                const resCliente = await fetch(`${NOCODB_BASE_URL}/${nomeTabelaExclusiva}`, {
                    headers: { 'xc-token': NOCODB_TOKEN }
                });
                const jsonCliente = await resCliente.json();
                listaItensCliente = jsonCliente.list || [];

                // Renderizar Cardápio e Banners
                renderizarTela();

            } catch (error) {
                console.error("Erro ao carregar cardápio:", error);
                document.body.innerHTML = "<h2 style='text-align:center; margin-top:50px;'>Erro ao carregar o cardápio. Tente novamente mais tarde.</h2>";
            }
        }

        function renderizarTela() {
            // Filtrar Produtos, Adicionais e Banners da tabela do cliente
            const produtos = listaItensCliente.filter(item => item.tipo === 'Produto' && item.disponivel !== false);
            const banners = listaItensCliente.filter(item => item.tipo === 'Banner');

            // Renderizar Banners se existirem
            if (banners.length > 0) {
                document.getElementById('promoBannerSection').style.display = 'block';
                document.getElementById('promoContainer').innerHTML = banners.map(b => `
                    <img src="${b.imagem ? b.imagem[0]?.url : ''}" onclick="abrirZoom(this.src)">
                `).join('');
            }

            // Agrupar e Renderizar Produtos
            const container = document.getElementById('menuContainer');
            container.innerHTML = `
                <div class="category-section">
                    <h2 class="section-title">🍔 Cardápio Principal</h2>
                    <div class="grid">
                        ${produtos.map(p => `
                            <div class="card">
                                <img src="${p.imagem ? p.imagem[0]?.url : 'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=600&q=80'}" onclick="abrirZoom(this.src)">
                                <div class="card-content">
                                    <div class="card-title">${p.nome}</div>
                                    <div class="card-desc">${p.descricao || ''}</div>
                                </div>
                                <div class="card-footer">
                                    <span class="price">R$ ${Number(p.valor).toFixed(2)}</span>
                                    <button class="btn" onclick="abrirModalProduto('${p.Id}')">Pedir</button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function abrirModalProduto(id) {
            produtoSelecionado = listaItensCliente.find(p => p.Id == id);
            if (!produtoSelecionado) return;

            document.getElementById('modalProductName').innerText = produtoSelecionado.nome;
            document.getElementById('modalProductDesc').innerText = produtoSelecionado.descricao || '';
            document.getElementById('modalProductImg').src = produtoSelecionado.imagem ? produtoSelecionado.imagem[0]?.url : '';

            // Buscar adicionais cadastrados na tabela dele
            const adicionais = listaItensCliente.filter(item => item.tipo === 'Adicional');

            document.getElementById('addonsList').innerHTML = adicionais.map(a => `
                <div class="addon-item">
                    <label><input type="checkbox" value="${a.valor}" data-nome="${a.nome}" onchange="calcularSubmodal()"> ${a.nome}</label>
                    <span>+ R$ ${Number(a.valor).toFixed(2)}</span>
                </div>
            `).join('');

            calcularSubmodal();
            document.getElementById('productModal').style.display = 'flex';
        }

        function calcularSubmodal() {
            let total = Number(produtoSelecionado.valor);
            document.querySelectorAll('#addonsList input:checked').forEach(cb => total += Number(cb.value));
            document.getElementById('modalTotalPrice').innerText = `R$ ${total.toFixed(2)}`;
        }

        function confirmAddToCart() {
            const checks = document.querySelectorAll('#addonsList input:checked');
            let extras = [];
            let extraPreco = 0;
            checks.forEach(c => {
                extras.push(c.dataset.nome);
                extraPreco += Number(c.value);
            });

            carrinho.push({
                nome: produtoSelecionado.nome,
                precoBase: Number(produtoSelecionado.valor),
                extras: extras,
                subtotal: Number(produtoSelecionado.valor) + extraPreco
            });

            closeModal('productModal');
            atualizarCarrinhoBarra();
        }

        function atualizarCarrinhoBarra() {
            const bar = document.getElementById('cartBar');
            if (carrinho.length === 0) {
                bar.style.display = 'none';
                return;
            }
            bar.style.display = 'flex';
            let totalGeral = carrinho.reduce((sum, item) => sum + item.subtotal, 0);
            document.getElementById('cartSummary').innerText = `${carrinho.length} item(ns) | Total: R$ ${totalGeral.toFixed(2)}`;
        }

        function openCheckoutModal() {
            let totalGeral = carrinho.reduce((sum, item) => sum + item.subtotal, 0);
            document.getElementById('checkoutTotal').innerText = `R$ ${totalGeral.toFixed(2)}`;
            document.getElementById('checkoutModal').style.display = 'flex';
        }

        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        function abrirZoom(src) { document.getElementById('zoomImg').src = src; document.getElementById('zoomModal').style.display = 'flex'; }

        // GERAR E ENVIAR NOTA FISCAL PARA O WHATSAPP
        function enviarPedidoWhatsApp() {
            const nome = document.getElementById('clientName').value;
            const telefone = document.getElementById('clientPhone').value;
            const endereco = document.getElementById('clientAddress').value;

            if (!nome || !telefone || !endereco) {
                alert("Preencha todos os dados de entrega!");
                return;
            }

            let texto = `🛒 *PEDIDO - ${dadosLicencaLojista.nome_loja}* 🧾\n\n`;
            texto += `👤 *Cliente:* ${nome}\n`;
            texto += `📞 *Tel:* ${telefone}\n`;
            texto += `📍 *Endereço:* ${endereco}\n\n`;
            texto += `----------------------------------------\n`;

            let total = 0;
            carrinho.forEach((i, idx) => {
                texto += `${idx + 1}. *${i.nome}* - R$ ${i.subtotal.toFixed(2)}\n`;
                if (i.extras.length > 0) texto += `   _Adicionais: ${i.extras.join(', ')}_\n`;
                total += i.subtotal;
            });

            texto += `----------------------------------------\n`;
            texto += `💰 *TOTAL GERAL: R$ ${total.toFixed(2)}*\n\n`;
            texto += `_Pedido gerado via Cardápio Digital_`;

            const url = `https://wa.me/${dadosLicencaLojista.whatsapp_vendedor}?text=${encodeURIComponent(texto)}`;
            window.open(url, '_blank');
        }

        // Iniciar
        inicializarSistema();
    </script>
</body>
</html>
