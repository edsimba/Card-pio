<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardápio Digital</title>
    <style>
        :root {
            --primary: #e67e22;
            --primary-dark: #d35400;
            --secondary: #2c3e50;
            --bg-color: #fcfcfc;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-muted: #7f8c8d;
            --success: #27ae60;
            --shadow: 0 10px 25px rgba(0,0,0,0.06);
            --radius: 16px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding-bottom: 110px; }

        header {
            background: linear-gradient(135deg, var(--secondary), #1a252f);
            color: white;
            padding: 30px 20px;
            text-align: center;
            border-bottom-left-radius: 24px;
            border-bottom-right-radius: 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }
        header h1 { font-size: 1.8rem; color: var(--primary); margin-bottom: 5px; font-weight: 700; }
        header p { font-size: 0.950rem; color: #bdc3c7; }

        .container { max-width: 1000px; margin: 25px auto; padding: 0 15px; }

        .promo-banner {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 30px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(230, 126, 34, 0.25);
            display: none;
        }
        .promo-banner h2 { font-size: 1.3rem; margin-bottom: 12px; }
        .promo-images { display: flex; gap: 12px; justify-content: center; overflow-x: auto; padding-bottom: 5px; }
        .promo-images img { width: 150px; height: 100px; object-fit: cover; border-radius: 12px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }

        .category-section { margin-bottom: 35px; }
        .section-title { font-size: 1.4rem; color: var(--secondary); margin-bottom: 18px; padding-bottom: 8px; border-bottom: 2px solid #eaeaea; font-weight: 700; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        
        .card { background: var(--card-bg); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); display: flex; flex-direction: column; justify-content: space-between; border: 1px solid #f0f0f0; cursor: pointer; transition: transform 0.2s; }
        .card:hover { transform: translateY(-4px); }
        .card img { width: 100%; height: 170px; object-fit: cover; }
        .card-content { padding: 16px; }
        .card-title { font-size: 1.15rem; font-weight: 700; color: var(--secondary); margin-bottom: 6px; }
        .card-desc { font-size: 0.88rem; color: var(--text-muted); margin-bottom: 12px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .card-footer { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: #fafafa; border-top: 1px solid #f2f2f2; }
        .price { font-size: 1.2rem; font-weight: 800; color: var(--primary); }

        .btn { background: var(--primary); color: white; border: none; padding: 8px 16px; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 0.9rem; }
        .btn:hover { background: var(--primary-dark); }
        .btn-success { background: var(--success); }
        .btn-success:hover { background: #219653; }

        .cart-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--secondary); color: white; padding: 16px 24px; display: none; justify-content: space-between; align-items: center; z-index: 900; box-shadow: 0 -6px 20px rgba(0,0,0,0.2); border-top-left-radius: 20px; border-top-right-radius: 20px; }
        .cart-info { font-size: 1.1rem; font-weight: 700; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 15px; }
        .modal { background: white; width: 100%; max-width: 480px; border-radius: 20px; overflow: hidden; max-height: 90vh; display: flex; flex-direction: column; box-shadow: 0 20px 40px rgba(0,0,0,0.2); }
        .modal-header { background: var(--secondary); color: white; padding: 18px 20px; display: flex; justify-content: space-between; align-items: center; }
        .modal-body { padding: 20px; overflow-y: auto; }
        .modal-body img { width: 100%; height: 220px; object-fit: cover; border-radius: 12px; margin-bottom: 15px; }
        .close-btn { background: none; border: none; color: white; font-size: 1.5rem; cursor: pointer; }
        
        .quantity-control { display: flex; align-items: center; justify-content: center; gap: 15px; margin: 20px 0; }
        .qty-btn { width: 36px; height: 36px; border-radius: 50%; border: 1px solid #ddd; background: #f8f9fa; font-size: 1.2rem; font-weight: bold; cursor: pointer; }
        .qty-value { font-size: 1.2rem; font-weight: 700; }

        .addon-group { margin-top: 15px; border-top: 1px solid #eee; padding-top: 15px; }
        .addon-item { display: flex; justify-content: space-between; margin-bottom: 10px; align-items: center; font-size: 0.95rem; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 5px; color: var(--secondary); }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 10px; font-size: 1rem; outline: none; }
        
        .modal-footer { padding: 18px 20px; background: #f8f9fa; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #eaeaea; }

        .zoom-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; justify-content: center; align-items: center; z-index: 2000; cursor: pointer; }
        .zoom-modal img { max-width: 90%; max-height: 90%; border-radius: 10px; }
    </style>
</head>
<body>

    <header>
        <h1 id="shopTitle">Carregando...</h1>
        <p>Escolha seus itens favoritos e peça direto pelo WhatsApp!</p>
    </header>

    <div class="container">
        <div class="promo-banner" id="promoBannerSection">
            <h2>🔥 Destaques e Promoções 🔥</h2>
            <div class="promo-images" id="promoContainer"></div>
        </div>

        <div id="menuContainer"></div>
    </div>

    <div class="cart-bar" id="cartBar">
        <div class="cart-info" id="cartSummary">0 itens | Total: R$ 0,00</div>
        <button class="btn btn-success" onclick="openCheckoutModal()">Finalizar Pedido 📲</button>
    </div>

    <div class="modal-overlay" id="productModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalProductName">Detalhes do Item</h3>
                <button class="close-btn" onclick="closeModal('productModal')">×</button>
            </div>
            <div class="modal-body">
                <img id="modalProductImg" src="">
                <p id="modalProductDesc" style="color: var(--text-muted); margin-bottom: 15px;"></p>
                
                <div class="quantity-control">
                    <button class="qty-btn" onclick="alterarQuantidadeModal(-1)">-</button>
                    <span class="qty-value" id="modalItemQty">1</span>
                    <button class="qty-btn" onclick="alterarQuantidadeModal(1)">+</button>
                </div>

                <div class="addon-group" id="addonSection" style="display:none;">
                    <h4>Deseja adicionar extras?</h4>
                    <div id="addonsList"></div>
                </div>
            </div>
            <div class="modal-footer">
                <div>Total: <span class="price" id="modalTotalPrice">R$ 0,00</span></div>
                <button class="btn" onclick="confirmAddToCart()">Adicionar ao Carrinho</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="checkoutModal">
        <div class="modal">
            <div class="modal-header">
                <h3>Finalizar Pedido</h3>
                <button class="close-btn" onclick="closeModal('checkoutModal')">×</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Seu Nome Completo:</label>
                    <input type="text" id="clientName" placeholder="Ex: Carlos Silva">
                </div>
                <div class="form-group">
                    <label>Seu WhatsApp com DDD:</label>
                    <input type="text" id="clientPhone" placeholder="Ex: (11) 98888-7777">
                </div>
                <div class="form-group">
                    <label>Endereço de Entrega Completo:</label>
                    <input type="text" id="clientAddress" placeholder="Rua, Número, Bairro, Complemento">
                </div>
            </div>
            <div class="modal-footer">
                <div>Total: <span class="price" id="checkoutTotal">R$ 0,00</span></div>
                <button class="btn btn-success" onclick="enviarPedidoWhatsApp()">Enviar para WhatsApp 📲</button>
            </div>
        </div>
    </div>

    <div class="zoom-modal" id="zoomModal" onclick="this.style.display='none'">
        <img id="zoomImg" src="">
    </div>

    <script>
        // AS VARIÁVEIS ABAIXO SÃO INJETADAS PELA VERCEL AUTOMATICAMENTE NO DEPLOY
        const NOCODB_BASE_URL = "__ENV_BASE_URL__";
        const NOCODB_TOKEN = "__ENV_TOKEN__";
        const TABELA_PRODUTOS = "__ENV_TABELA_PRODUTOS__";
        const TABELA_CONFIG = "__ENV_TABELA_CONFIG__";

        let dadosLoja = { nome: "Cardápio Digital", whatsapp: "" };
        let listaProdutos = [];
        let carrinho = [];
        let produtoSelecionado = null;
        let quantidadeAtualModal = 1;

        async function inicializarLoja() {
            try {
                const resConfig = await fetch(`${NOCODB_BASE_URL}/${TABELA_CONFIG}`, {
                    headers: { 'xc-token': NOCODB_TOKEN }
                });
                const dataConfig = await resConfig.json();
                if (dataConfig.list && dataConfig.list.length > 0) {
                    dadosLoja.nome = dataConfig.list[0].nome_loja || "Cardápio Digital";
                    dadosLoja.whatsapp = dataConfig.list[0].whatsapp || "";
                }
                document.getElementById('shopTitle').innerText = dadosLoja.nome;

                const resProdutos = await fetch(`${NOCODB_BASE_URL}/${TABELA_PRODUTOS}`, {
                    headers: { 'xc-token': NOCODB_TOKEN }
                });
                const dataProdutos = await resProdutos.json();
                listaProdutos = dataProdutos.list || [];

                renderizarCardapio();
            } catch (error) {
                console.error("Erro ao carregar dados:", error);
                document.getElementById('menuContainer').innerHTML = "<p style='text-align:center; color:red; margin-top:30px;'>Erro ao carregar o cardápio.</p>";
            }
        }

        function renderizarCardapio() {
            const banners = listaProdutos.filter(p => p.tipo === 'Banner' && p.disponivel !== false);
            if (banners.length > 0) {
                document.getElementById('promoBannerSection').style.display = 'block';
                document.getElementById('promoContainer').innerHTML = banners.map(b => `
                    <img src="${b.imagem ? b.imagem[0]?.url : ''}" onclick="abrirZoom(this.src)">
                `).join('');
            }

            const itensCardapio = listaProdutos.filter(p => p.tipo === 'Produto' && p.disponivel !== false);
            const categorias = [...new Set(itensCardapio.map(p => p.categoria || 'Outros'))];

            const container = document.getElementById('menuContainer');
            container.innerHTML = "";

            categorias.forEach(cat => {
                const produtosDaCat = itensCardapio.filter(p => (p.categoria || 'Outros') === cat);
                
                let htmlCat = `
                    <div class="category-section">
                        <h2 class="section-title">🍽️ ${cat}</h2>
                        <div class="grid">
                `;

                produtosDaCat.forEach(p => {
                    const imgUrl = p.imagem ? p.imagem[0]?.url : 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=600&q=80';
                    htmlCat += `
                        <div class="card" onclick="abrirModalProduto('${p.Id}')">
                            <img src="${imgUrl}">
                            <div class="card-content">
                                <div class="card-title">${p.nome}</div>
                                <div class="card-desc">${p.descricao || 'Sem descrição.'}</div>
                            </div>
                            <div class="card-footer">
                                <span class="price">R$ ${Number(p.valor).toFixed(2)}</span>
                                <button class="btn">Pedir</button>
                            </div>
                        </div>
                    `;
                });

                htmlCat += `</div></div>`;
                container.innerHTML += htmlCat;
            });
        }

        function abrirModalProduto(id) {
            produtoSelecionado = listaProdutos.find(p => p.Id == id);
            if (!produtoSelecionado) return;

            quantidadeAtualModal = 1;
            document.getElementById('modalItemQty').innerText = 1;
            document.getElementById('modalProductName').innerText = produtoSelecionado.nome;
            document.getElementById('modalProductDesc').innerText = produtoSelecionado.descricao || '';
            document.getElementById('modalProductImg').src = produtoSelecionado.imagem ? produtoSelecionado.imagem[0]?.url : '';

            const adicionais = listaProdutos.filter(p => p.tipo === 'Adicional' && p.disponivel !== false);
            const addonSection = document.getElementById('addonSection');

            if (adicionais.length > 0) {
                addonSection.style.display = 'block';
                document.getElementById('addonsList').innerHTML = adicionais.map(a => `
                    <div class="addon-item">
                        <label><input type="checkbox" value="${a.valor}" data-nome="${a.nome}" onchange="calcularSubtotalModal()"> ${a.nome}</label>
                        <span style="font-weight:600; color:var(--primary);">+ R$ ${Number(a.valor).toFixed(2)}</span>
                    </div>
                `).join('');
            } else {
                addonSection.style.display = 'none';
            }

            calcularSubtotalModal();
            document.getElementById('productModal').style.display = 'flex';
        }

        function alterarQuantidadeModal(valor) {
            quantidadeAtualModal += valor;
            if (quantidadeAtualModal < 1) quantidadeAtualModal = 1;
            document.getElementById('modalItemQty').innerText = quantidadeAtualModal;
            calcularSubtotalModal();
        }

        function calcularSubtotalModal() {
            let base = Number(produtoSelecionado.valor);
            let extras = 0;
            document.querySelectorAll('#addonsList input:checked').forEach(cb => {
                extras += Number(cb.value);
            });
            let total = (base + extras) * quantidadeAtualModal;
            document.getElementById('modalTotalPrice').innerText = `R$ ${total.toFixed(2)}`;
        }

        function confirmAddToCart() {
            let extrasSelecionados = [];
            let precoExtras = 0;
            document.querySelectorAll('#addonsList input:checked').forEach(cb => {
                extrasSelecionados.push(cb.dataset.nome);
                precoExtras += Number(cb.value);
            });

            let precoUnitarioFinal = Number(produtoSelecionado.valor) + precoExtras;

            carrinho.push({
                nome: produtoSelecionado.nome,
                quantidade: quantidadeAtualModal,
                precoUnitario: precoUnitarioFinal,
                extras: extrasSelecionados,
                subtotal: precoUnitarioFinal * quantidadeAtualModal
            });

            closeModal('productModal');
            atualizarBarraCarrinho();
        }

        function atualizarBarraCarrinho() {
            const bar = document.getElementById('cartBar');
            if (carrinho.length === 0) {
                bar.style.display = 'none';
                return;
            }
            bar.style.display = 'flex';
            let totalGeral = carrinho.reduce((sum, item) => sum + item.subtotal, 0);
            let qtdItens = carrinho.reduce((sum, item) => sum + item.quantidade, 0);
            document.getElementById('cartSummary').innerText = `${qtdItens} item(ns) | Total: R$ ${totalGeral.toFixed(2)}`;
        }

        function openCheckoutModal() {
            let totalGeral = carrinho.reduce((sum, item) => sum + item.subtotal, 0);
            document.getElementById('checkoutTotal').innerText = `R$ ${totalGeral.toFixed(2)}`;
            document.getElementById('checkoutModal').style.display = 'flex';
        }

        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        function abrirZoom(src) { document.getElementById('zoomImg').src = src; document.getElementById('zoomModal').style.display = 'flex'; }

        function enviarPedidoWhatsApp() {
            const nome = document.getElementById('clientName').value;
            const telefone = document.getElementById('clientPhone').value;
            const endereco = document.getElementById('clientAddress').value;

            if (!nome || !telefone || !endereco) {
                alert("Por favor, preencha todos os campos de entrega!");
                return;
            }

            if (!dadosLoja.whatsapp) {
                alert("O número de WhatsApp da loja não foi configurado na tabela de configuração do NocoDB.");
                return;
            }

            let texto = `🛒 *NOVO PEDIDO - ${dadosLoja.nome}* 🧾\n\n`;
            texto += `👤 *Cliente:* ${nome}\n`;
            texto += `📞 *WhatsApp:* ${telefone}\n`;
            texto += `📍 *Endereço:* ${endereco}\n\n`;
            texto += `----------------------------------------\n`;

            let totalGeral = 0;
            carrinho.forEach((i, idx) => {
                texto += `${idx + 1}. *${i.quantidade}x ${i.nome}* - R$ ${i.subtotal.toFixed(2)}\n`;
                if (i.extras.length > 0) {
                    texto += `   _Extras: ${i.extras.join(', ')}_\n`;
                }
                totalGeral += i.subtotal;
            });

            texto += `----------------------------------------\n`;
            texto += `💰 *TOTAL A PAGAR: R$ ${totalGeral.toFixed(2)}*\n\n`;
            texto += `_Pedido gerado automaticamente pelo cardápio._`;

            const url = `https://wa.me/${dadosLoja.whatsapp}?text=${encodeURIComponent(texto)}`;
            window.open(url, '_blank');
        }

        inicializarLoja();
    </script>
</body>
</html>
