<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardápio Digital Interativo</title>
    <!-- Tailwind CSS CDN para estilização moderna e responsiva -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Ícones Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Personalização da barra de rolagem */
        ::-webkit-scrollbar {
            height: 6px;
            width: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 pb-24 min-h-screen">

    <!-- Configuração da Aplicação via Variáveis da Vercel com Fallback Local -->
    <script>
        const CONFIG = {
            TELEFONE_WHATSAPP: "<!-- %TELEFONE_WHATSAPP% -->" !== "<!-- " + "%TELEFONE_WHATSAPP%" + " -->" ? "<!-- %TELEFONE_WHATSAPP% -->" : "5589999999999",
            NOCODB_URL: "<!-- %NOCODB_URL% -->" !== "<!-- " + "%NOCODB_URL%" + " -->" ? "<!-- %NOCODB_URL% -->" : "https://app.nocodb.com",
            NOCODB_TOKEN: "<!-- %NOCODB_TOKEN% -->" !== "<!-- " + "%NOCODB_TOKEN%" + " -->" ? "<!-- %NOCODB_TOKEN% -->" : "SEU_NOCODB_API_TOKEN_AQUI",
            NOCODB_TABLE_PATH: "<!-- %NOCODB_TABLE_PATH% -->" !== "<!-- " + "%NOCODB_TABLE_PATH%" + " -->" ? "<!-- %NOCODB_TABLE_PATH% -->" : "/api/v2/tables/SEU_TABLE_ID/records"
        };
    </script>

    <!-- Header Principal do Estabelecimento -->
    <header class="bg-amber-600 text-white p-4 shadow-md sticky top-0 z-20">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold tracking-wide">Lanchonete & Hamburgueria</h1>
                <p class="text-xs text-amber-100 flex items-center gap-1 mt-0.5">
                    <span class="w-2 h-2 bg-green-400 rounded-full inline-block animate-pulse"></span> Aberto agora para pedidos
                </p>
            </div>
            <button onclick="abrirCarrinho()" class="relative p-2 bg-amber-700 rounded-full hover:bg-amber-800 transition">
                <i data-lucide="shopping-bag" class="w-6 h-6"></i>
                <span id="carrinho-qtd-badge" class="absolute -top-1 -right-1 bg-red-500 text-white text-xs font-bold w-5 h-5 rounded-full flex items-center justify-center hidden">0</span>
            </button>
        </div>
    </header>

    <!-- Navegação por Categorias (Rolagem Horizontal Suave) -->
    <nav class="bg-white shadow-sm border-b sticky top-[65px] z-10 py-3 px-4">
        <div class="max-w-md mx-auto flex gap-2 overflow-x-auto no-scrollbar" id="container-categorias">
            <!-- As categorias serão injetadas dinamicamente via JS -->
        </div>
    </nav>

    <!-- Conteúdo Principal: Lista de Produtos -->
    <main class="max-w-md mx-auto p-4 space-y-4" id="container-produtos">
        <div class="text-center py-12 text-gray-500" id="loading-state">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-amber-600 border-t-transparent mb-2"></div>
            <p class="text-sm">Carregando cardápio...</p>
        </div>
    </main>

    <!-- Barra Flutuante de Resumo do Carrinho no Rodapé -->
    <div id="barra-carrinho-flutuante" class="fixed bottom-4 left-4 right-4 max-w-md mx-auto bg-gray-900 text-white p-4 rounded-2xl shadow-2xl flex justify-between items-center z-20 hidden">
        <div>
            <p class="text-xs text-gray-400">Total acumulado</p>
            <p id="carrinho-total-flutuante" class="text-lg font-bold text-amber-400">R$ 0,00</p>
        </div>
        <button onclick="abrirCarrinho()" class="bg-amber-500 hover:bg-amber-600 text-gray-950 font-bold px-5 py-2.5 rounded-xl text-sm flex items-center gap-2 transition">
            Ver Pedido <i data-lucide="arrow-right" class="w-4 h-4"></i>
        </button>
    </div>

    <!-- Modal 1: Lightbox (Ampliação da Imagem e Detalhes) -->
    <div id="modal-lightbox" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden" onclick="fecharLightbox()">
        <div class="bg-white rounded-2xl overflow-hidden max-w-sm w-full shadow-2xl" onclick="event.stopPropagation()">
            <div class="relative bg-black">
                <img id="lightbox-img" src="" alt="Produto" class="w-full h-64 object-cover">
                <div id="lightbox-badge-promocao" class="absolute top-3 left-3 bg-red-600 text-white text-xs font-bold px-2.5 py-1 rounded-lg shadow uppercase tracking-wider hidden flex items-center gap-1">
                    <i data-lucide="flame" class="w-3.5 h-3.5"></i> Promoção
                </div>
                <button onclick="fecharLightbox()" class="absolute top-3 right-3 bg-black/60 text-white p-1.5 rounded-full hover:bg-black">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <div class="p-5">
                <h3 id="lightbox-titulo" class="text-lg font-bold text-gray-900"></h3>
                <p id="lightbox-ingredientes" class="text-sm text-gray-600 mt-2 leading-relaxed"></p>
                <div class="mt-4 flex justify-between items-center pt-3 border-t">
                    <span id="lightbox-preco" class="text-xl font-extrabold text-amber-600"></span>
                    <button id="lightbox-btn-add" class="bg-amber-600 text-white px-4 py-2 rounded-xl text-sm font-semibold hover:bg-amber-700 transition flex items-center gap-1.5">
                        <i data-lucide="plus" class="w-4 h-4"></i> Adicionar
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal 2: Carrinho de Compras e Form de Checkout -->
    <div id="modal-carrinho" class="fixed inset-0 bg-black/50 z-40 flex justify-end hidden">
        <div class="bg-white w-full max-w-md h-full flex flex-col justify-between shadow-2xl animate-in slide-in-from-right duration-300">
            <!-- Topo do Carrinho -->
            <div class="p-4 border-b flex justify-between items-center bg-gray-50">
                <h2 class="text-lg font-bold text-gray-800 flex items-center gap-2">
                    <i data-lucide="shopping-cart" class="w-5 h-5 text-amber-600"></i> Seu Pedido
                </h2>
                <button onclick="fecharCarrinho()" class="p-2 hover:bg-gray-200 rounded-full text-gray-600">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <!-- Lista de Produtos Adicionados + Form de Entrega -->
            <div class="p-4 overflow-y-auto space-y-6 flex-1" id="corpo-carrinho">
                <div>
                    <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">Itens selecionados</h3>
                    <div id="lista-itens-carrinho" class="space-y-3">
                        <!-- Injetado via JS -->
                    </div>
                </div>

                <form id="form-checkout" class="space-y-4 pt-4 border-t">
                    <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider">Dados para Entrega</h3>
                    
                    <div>
                        <label class="block text-xs font-medium text-gray-700 mb-1">Seu Nome *</label>
                        <input type="text" id="cliente-nome" required placeholder="Digite seu nome completo" class="w-full px-3 py-2 border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
                    </div>

                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label class="block text-xs font-medium text-gray-700">Endereço de Entrega *</label>
                            <button type="button" onclick="obterLocalizacaoGPS()" class="text-xs text-amber-600 font-semibold flex items-center gap-1 hover:underline">
                                <i data-lucide="map-pin" class="w-3.5 h-3.5"></i> Usar GPS
                            </button>
                        </div>
                        <input type="text" id="cliente-endereco" required placeholder="Rua, Número, Bairro" class="w-full px-3 py-2 border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
                        <input type="hidden" id="cliente-link-maps" value="">
                        <p id="status-gps" class="text-[11px] text-green-600 font-medium mt-1 hidden flex items-center gap-1">
                            <i data-lucide="check-circle" class="w-3 h-3"></i> Localização GPS anexada com sucesso!
                        </p>
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-gray-700 mb-1">Ponto de Referência *</label>
                        <input type="text" id="cliente-referencia" required placeholder="Ex: Próximo à praça principal / Casa amarela" class="w-full px-3 py-2 border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-gray-700 mb-1">Forma de Pagamento *</label>
                        <select id="cliente-pagamento" class="w-full px-3 py-2 border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
                            <option value="PIX">PIX (Chave enviada na confirmação)</option>
                            <option value="Cartão de Crédito/Débito">Cartão de Crédito/Débito (Levar maquininha)</option>
                            <option value="Dinheiro">Dinheiro</option>
                        </select>
                    </div>
                </form>
            </div>

            <!-- Rodapé com Total e Ação de Finalizar -->
            <div class="p-4 border-t bg-gray-50 space-y-3">
                <div class="flex justify-between items-center text-sm">
                    <span class="text-gray-600">Subtotal</span>
                    <span id="carrinho-subtotal" class="font-semibold text-gray-900">R$ 0,00</span>
                </div>
                <div class="flex justify-between items-center text-base font-bold text-gray-900 pt-1 border-t">
                    <span>Total a Pagar</span>
                    <span id="carrinho-total-modal" class="text-xl text-amber-600">R$ 0,00</span>
                </div>
                <button onclick="finalizarPedidoWhatsApp()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3.5 rounded-xl shadow-lg flex items-center justify-center gap-2 transition">
                    <i data-lucide="send" class="w-5 h-5"></i> Enviar Pedido no WhatsApp
                </button>
            </div>
        </div>
    </div>

    <!-- Script de Lógica do Sistema -->
    <script>
        let produtosGlobal = [];
        let carrinho = [];
        let categoriaAtiva = 'todas';

        // Dados de teste caso a API do NocoDB não seja acessada localmente
        const MOCK_PRODUTOS = [
            {
                id: 1,
                titulo: "Combo X-Burger + Refri",
                descricao: "Pão brioche, hambúrguer artesanal 180g, queijo cheddar, bacon crocante + Coca-Cola lata geladinha.",
                preco: 32.90,
                categoria: "Combos",
                em_promocao: true,
                imagem_url: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500&q=80"
            },
            {
                id: 2,
                titulo: "X-Burger Simples",
                descricao: "Pão brioche, hambúrguer de fraldinha 180g e queijo cheddar fatiado.",
                preco: 24.90,
                categoria: "Lanches",
                em_promocao: false,
                imagem_url: "https://images.unsplash.com/photo-1586190848861-99aa4a171e90?w=500&q=80"
            },
            {
                id: 3,
                titulo: "Batata Suprema",
                descricao: "Porção de 400g de batata frita coberta com molho cheddar cremoso e bacon em cubos.",
                preco: 18.00,
                categoria: "Porções",
                em_promocao: true,
                imagem_url: "https://images.unsplash.com/photo-1576107232684-1279f390859f?w=500&q=80"
            },
            {
                id: 4,
                titulo: "Coca-Cola Lata 350ml",
                descricao: "Geladinha, lata 350ml.",
                preco: 6.00,
                categoria: "Bebidas",
                em_promocao: false,
                imagem_url: "https://images.unsplash.com/photo-1622483767028-3f66f32aef97?w=500&q=80"
            }
        ];

        document.addEventListener("DOMContentLoaded", () => {
            carregarProdutos();
            lucide.createIcons();
        });

        // 1. Requisição para o NocoDB
        async function carregarProdutos() {
            try {
                const response = await fetch(`${CONFIG.NOCODB_URL}${CONFIG.NOCODB_TABLE_PATH}`, {
                    method: "GET",
                    headers: {
                        "xc-token": CONFIG.NOCODB_TOKEN,
                        "Content-Type": "application/json"
                    }
                });

                if (!response.ok) throw new Error("Erro de comunicação com o NocoDB");

                const data = await response.json();
                produtosGlobal = data.list || data;
                renderizarInterface();
            } catch (error) {
                console.warn("API NocoDB offline ou token não preenchido. Usando dados locais para demonstração.", error);
                produtosGlobal = MOCK_PRODUTOS;
                renderizarInterface();
            }
        }

        // 2. Renderização de Categorias e Produtos
        function renderizarInterface() {
            const containerProdutos = document.getElementById("container-produtos");
            const containerCategorias = document.getElementById("container-categorias");
            
            // Verifica se há pelo menos um item marcado em promoção
            const temPromocoes = produtosGlobal.some(p => p.em_promocao === true || p.em_promocao === "true" || p.em_promocao === 1);

            let categorias = ['todas'];
            if (temPromocoes) {
                categorias.push('promocoes');
            }
            categorias.push(...new Set(produtosGlobal.map(p => p.categoria)));

            // Renderizar Abas de Categorias
            containerCategorias.innerHTML = categorias.map(cat => {
                let nomeExibicao = cat;
                if (cat === 'todas') nomeExibicao = 'Todas';
                if (cat === 'promocoes') nomeExibicao = '🔥 Promoções';

                return `
                    <button onclick="filtrarCategoria('${cat}')" 
                            class="categoria-btn px-4 py-1.5 rounded-full text-sm font-medium capitalize shrink-0 transition ${cat === categoriaAtiva ? 'bg-amber-600 text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'}">
                        ${nomeExibicao}
                    </button>
                `;
            }).join('');

            // Filtragem de Produtos
            let produtosFiltrados = [];
            if (categoriaAtiva === 'todas') {
                produtosFiltrados = produtosGlobal;
            } else if (categoriaAtiva === 'promocoes') {
                produtosFiltrados = produtosGlobal.filter(p => p.em_promocao === true || p.em_promocao === "true" || p.em_promocao === 1);
            } else {
                produtosFiltrados = produtosGlobal.filter(p => p.categoria === categoriaAtiva);
            }

            if (produtosFiltrados.length === 0) {
                containerProdutos.innerHTML = `<p class="text-center py-8 text-gray-500">Nenhum produto encontrado nesta categoria.</p>`;
                return;
            }

            // Renderizar Lista de Produtos
            containerProdutos.innerHTML = produtosFiltrados.map(prod => {
                const emPromo = prod.em_promocao === true || prod.em_promocao === "true" || prod.em_promocao === 1;

                return `
                    <div class="bg-white rounded-2xl p-3 shadow-sm border border-gray-100 flex gap-3 items-center relative overflow-hidden">
                        <!-- Foto do Produto com Evento Lightbox -->
                        <div class="relative w-24 h-24 rounded-xl overflow-hidden shrink-0 cursor-pointer group" onclick="abrirLightbox(${prod.id})">
                            <img src="${prod.imagem_url}" alt="${prod.titulo}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                            <div class="absolute inset-0 bg-black/20 flex items-center justify-center opacity-0 group-hover:opacity-100 transition">
                                <i data-lucide="maximize-2" class="w-5 h-5 text-white"></i>
                            </div>
                        </div>

                        <!-- Descrição do Produto -->
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center gap-1.5 mb-0.5">
                                <h3 class="font-bold text-gray-900 text-sm truncate cursor-pointer" onclick="abrirLightbox(${prod.id})">${prod.titulo}</h3>
                            </div>
                            <p class="text-xs text-gray-500 line-clamp-2">${prod.descricao}</p>
                            
                            <div class="mt-2 flex justify-between items-center">
                                <div class="flex items-center gap-2">
                                    <span class="font-extrabold text-amber-600 text-sm">R$ ${parseFloat(prod.preco).toFixed(2).replace('.', ',')}</span>
                                    ${emPromo ? `<span class="bg-red-100 text-red-700 text-[10px] font-bold px-2 py-0.5 rounded-full flex items-center gap-0.5">🔥 Promo</span>` : ''}
                                </div>
                                <button onclick="adicionarAoCarrinho(${prod.id})" class="bg-amber-100 text-amber-800 hover:bg-amber-600 hover:text-white px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1">
                                    <i data-lucide="plus" class="w-3.5 h-3.5"></i> Adicionar
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            lucide.createIcons();
        }

        // 3. Troca de Categorias
        function filtrarCategoria(cat) {
            categoriaAtiva = cat;
            renderizarInterface();
        }

        // 4. Modal Lightbox (Ampliação de Fotos)
        function abrirLightbox(idProduto) {
            const produto = produtosGlobal.find(p => p.id === idProduto);
            if (!produto) return;

            document.getElementById("lightbox-img").src = produto.imagem_url;
            document.getElementById("lightbox-titulo").innerText = produto.titulo;
            document.getElementById("lightbox-ingredientes").innerText = produto.descricao;
            document.getElementById("lightbox-preco").innerText = `R$ ${parseFloat(produto.preco).toFixed(2).replace('.', ',')}`;
            
            const badgePromo = document.getElementById("lightbox-badge-promocao");
            const emPromo = produto.em_promocao === true || produto.em_promocao === "true" || produto.em_promocao === 1;
            
            if (emPromo) {
                badgePromo.classList.remove("hidden");
            } else {
                badgePromo.classList.add("hidden");
            }

            const btnAdd = document.getElementById("lightbox-btn-add");
            btnAdd.onclick = () => {
                adicionarAoCarrinho(produto.id);
                fecharLightbox();
            };

            document.getElementById("modal-lightbox").classList.remove("hidden");
            lucide.createIcons();
        }

        function fecharLightbox() {
            document.getElementById("modal-lightbox").classList.add("hidden");
        }

        // 5. Funções de Carrinho
        function adicionarAoCarrinho(idProduto) {
            const itemExistente = carrinho.find(item => item.id === idProduto);
            if (itemExistente) {
                itemExistente.quantidade++;
            } else {
                const produto = produtosGlobal.find(p => p.id === idProduto);
                carrinho.push({ ...produto, quantidade: 1 });
            }
            atualizarCarrinhoUI();
        }

        function alterarQuantidade(idProduto, delta) {
            const index = carrinho.findIndex(item => item.id === idProduto);
            if (index === -1) return;

            carrinho[index].quantidade += delta;
            if (carrinho[index].quantidade <= 0) {
                carrinho.splice(index, 1);
            }
            atualizarCarrinhoUI();
        }

        function atualizarCarrinhoUI() {
            const totalItens = carrinho.reduce((sum, item) => sum + item.quantidade, 0);
            const valorTotal = carrinho.reduce((sum, item) => sum + (item.preco * item.quantidade), 0);

            const badge = document.getElementById("carrinho-qtd-badge");
            const barraFlutuante = document.getElementById("barra-carrinho-flutuante");
            
            if (totalItens > 0) {
                badge.innerText = totalItens;
                badge.classList.remove("hidden");
                barraFlutuante.classList.remove("hidden");
            } else {
                badge.classList.add("hidden");
                barraFlutuante.classList.add("hidden");
                fecharCarrinho();
            }

            document.getElementById("carrinho-total-flutuante").innerText = `R$ ${valorTotal.toFixed(2).replace('.', ',')}`;
            document.getElementById("carrinho-subtotal").innerText = `R$ ${valorTotal.toFixed(2).replace('.', ',')}`;
            document.getElementById("carrinho-total-modal").innerText = `R$ ${valorTotal.toFixed(2).replace('.', ',')}`;

            const containerLista = document.getElementById("lista-itens-carrinho");
            if (carrinho.length === 0) {
                containerLista.innerHTML = `<p class="text-xs text-gray-400 text-center py-4">Seu carrinho está vazio.</p>`;
                return;
            }

            containerLista.innerHTML = carrinho.map(item => `
                <div class="flex justify-between items-center bg-gray-50 p-2.5 rounded-xl border border-gray-100">
                    <div class="flex-1 min-w-0 pr-2">
                        <p class="font-semibold text-sm text-gray-900 truncate">${item.titulo}</p>
                        <p class="text-xs text-gray-500">R$ ${parseFloat(item.preco).toFixed(2).replace('.', ',')} un.</p>
                    </div>
                    <div class="flex items-center gap-2 bg-white px-2 py-1 rounded-lg border">
                        <button onclick="alterarQuantidade(${item.id}, -1)" class="text-gray-500 hover:text-red-600 font-bold px-1">-</button>
                        <span class="text-xs font-bold text-gray-800 w-4 text-center">${item.quantidade}</span>
                        <button onclick="alterarQuantidade(${item.id}, 1)" class="text-gray-500 hover:text-green-600 font-bold px-1">+</button>
                    </div>
                </div>
            `).join('');
        }

        function abrirCarrinho() {
            if (carrinho.length === 0) return;
            document.getElementById("modal-carrinho").classList.remove("hidden");
        }

        function fecharCarrinho() {
            document.getElementById("modal-carrinho").classList.add("hidden");
        }

        // 6. Captura de Geolocalização (GPS)
        function obterLocalizacaoGPS() {
            const statusGps = document.getElementById("status-gps");
            if (!navigator.geolocation) {
                alert("Navegador não suporta geolocalização.");
                return;
            }

            statusGps.innerText = "Obtendo localização...";
            statusGps.classList.remove("hidden");

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    const linkMaps = `https://www.google.com/maps?q=${lat},${lng}`;
                    
                    document.getElementById("cliente-link-maps").value = linkMaps;
                    statusGps.innerHTML = `<i data-lucide="check-circle" class="w-3.5 h-3.5 inline"></i> Localização GPS capturada com sucesso!`;
                    lucide.createIcons();
                },
                (error) => {
                    alert("Não foi possível obter a localização exata por GPS.");
                    statusGps.classList.add("hidden");
                },
                { enableHighAccuracy: true }
            );
        }

        // 7. Envio do Pedido Formatado para o WhatsApp
        function finalizarPedidoWhatsApp() {
            const nome = document.getElementById("cliente-nome").value.trim();
            const endereco = document.getElementById("cliente-endereco").value.trim();
            const referencia = document.getElementById("cliente-referencia").value.trim();
            const pagamento = document.getElementById("cliente-pagamento").value;
            const linkMaps = document.getElementById("cliente-link-maps").value;

            if (!nome || !endereco || !referencia) {
                alert("Por favor, preencha todos os campos obrigatórios para a entrega.");
                return;
            }

            const valorTotal = carrinho.reduce((sum, item) => sum + (item.preco * item.quantidade), 0);
            const dataHora = new Date().toLocaleString('pt-BR');

            let mensagem = `🧾 *NOTA FISCAL DE PEDIDO*\n`;
            mensagem += `📅 Data: ${dataHora}\n`;
            mensagem += `-----------------------------------\n\n`;
            
            mensagem += `👤 *CLIENTE*\n`;
            mensagem += `• *Nome:* ${nome}\n\n`;

            mensagem += `🛒 *ITENS DO PEDIDO*\n`;
            carrinho.forEach(item => {
                const subtotalItem = (item.preco * item.quantidade).toFixed(2).replace('.', ',');
                mensagem += `▪️ ${item.quantidade}x ${item.titulo}\n`;
                mensagem += `   └ R$ ${subtotalItem}\n`;
            });

            mensagem += `\n-----------------------------------\n`;
            mensagem += `💰 *TOTAL DO PEDIDO:* R$ ${valorTotal.toFixed(2).replace('.', ',')}\n`;
            mensagem += `💳 *Forma de Pagamento:* ${pagamento}\n`;
            mensagem += `-----------------------------------\n\n`;

            mensagem += `📍 *ENDEREÇO DE ENTREGA*\n`;
            mensagem += `• ${endereco}\n`;
            mensagem += `• *Ponto de Referência:* ${referencia}\n`;

            if (linkMaps) {
                mensagem += `\n🌐 *Localização Exata no Google Maps:*\n${linkMaps}\n`;
            }

            mensagem += `\n_Pedido gerado via Cardápio Digital._`;

            const urlWhatsApp = `https://wa.me/${CONFIG.TELEFONE_WHATSAPP}?text=${encodeURIComponent(mensagem)}`;
            window.open(urlWhatsApp, '_blank');
        }
    </script>
</body>
</html>
